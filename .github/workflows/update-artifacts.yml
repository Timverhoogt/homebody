name: Build managed update artifacts (no publication)
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag (vX.Y.Z) on the canonical repository
        required: true
      release_id:
        description: Numeric ID of the existing draft GitHub release for this tag
        required: true
permissions:
  contents: read
jobs:
  artifacts:
    if: github.repository == 'Timverhoogt/homebody'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build tools only
        run: python -m pip install 'build>=1.2,<2' 'setuptools>=77' 'httpx>=0.28,<1' 'packaging>=24'
      - name: Verify draft identity and build release-bound wheel
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python -c 'import os,re; assert re.fullmatch(r"v\d+\.\d+\.\d+",os.environ["RELEASE_TAG"]); assert re.fullmatch(r"[1-9]\d*",os.environ["RELEASE_ID"])'
          gh api "repos/Timverhoogt/homebody/releases/$RELEASE_ID" > release-info.json
          python -c 'import json,os; d=json.load(open("release-info.json")); assert d["draft"] is True and d["prerelease"] is False and d["tag_name"] == os.environ["RELEASE_TAG"]'
          COMMIT=$(git rev-parse HEAD)
          export SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          python tools/release_manifest.py --release-id "$RELEASE_ID" --commit "$COMMIT" --prepare
          python -m build --wheel
          python tools/release_manifest.py --release-id "$RELEASE_ID" --commit "$COMMIT" --wheel dist/*.whl
          python -c 'import json,os; assert json.load(open("dist/homebody-update.json"))["tag"] == os.environ["RELEASE_TAG"]'
      - uses: actions/upload-artifact@v4
        with:
          name: homebody-managed-update
          path: |
            dist/*.whl
            dist/homebody-update.json
          if-no-files-found: error
