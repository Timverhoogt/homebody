name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python-version: "3.11", lane: unit}
          - {python-version: "3.12", lane: unit}
          - {python-version: "3.11", lane: browser}
    name: ${{ matrix.lane }} / Python ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      # The Reachy Mini SDK needs GStreamer/PyGObject and is stubbed in tests/conftest.py,
      # so install the package without dependencies and add every other runtime import.
      - name: Install test environment
        run: |
          uv venv
          uv pip install -e . --no-deps
          uv pip install \
            "aioesphomeapi>=45.6,<46" \
            aiohttp \
            "dbus-next==0.2.3" \
            "evdev==1.9.3" \
            fastapi \
            "httpx>=0.28,<1" \
            "mutagen>=1.47,<2" \
            "numpy>=1.26" \
            "scipy>=1.11,<2" \
            "onnxruntime>=1.20,<2" \
            "opencv-python-headless>=4.11,<6" \
            "Pillow>=10,<13" \
            pydantic \
            pyyaml \
            "sherpa-onnx>=1.13.4,<2" \
            "websockets>=15,<17" \
            "uvicorn>=0.30" \
            build pytest ruff "pip>=24" "setuptools>=69" wheel
          # uv venv is unseeded; real worker tests call python -m pip and
          # the release regression uses build --no-isolation with this backend.
          .venv/bin/python -m pip --version
          .venv/bin/python -c 'import build, setuptools, wheel'
      - name: Lint
        run: .venv/bin/ruff check .
      - name: Check JavaScript syntax
        run: |
          for file in homebody/static/*.js; do node --check "$file"; done
      - name: Build wheel before artifact tests
        if: matrix.lane == 'unit'
        run: .venv/bin/python -m build --wheel
      - name: Install Chromium test runtime
        if: matrix.lane == 'browser'
        run: |
          uv pip install playwright
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Unit gate
        if: matrix.lane == 'unit'
        run: .venv/bin/python tools/checks.py unit
        env:
          OPENAI_API_KEY: ""
          ELEVENLABS_API_KEY: ""
      - name: Browser gate (bounded batches, no silent skips)
        if: matrix.lane == 'browser'
        run: .venv/bin/python tools/checks.py browser
      - name: Keep timing and JUnit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-${{ matrix.lane }}-${{ matrix.python-version }}
          path: .artifacts/test-runs/
          retention-days: 7
