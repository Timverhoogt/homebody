<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">Homebody: purpose, authority and speech are separate</title>
  <desc id="desc">Local Reachy controls connect to a trusted authenticated bridge. Everyday is narrow help without private memory or a full agent fallback. Kids uses isolated moderated prompts and consented I Spy frames, never adult tools. Registered Workspace connects to a real native Hermes project session with history and exact work approvals. Speech transport is separate from text and vision funding. Subscription inference still goes to the cloud; moderation and speech remain API services. Local camera preview never goes to a cloud model.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111318"/><stop offset="1" stop-color="#19162a"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#ff9a7b"/></marker>
    <style>
      .box{fill:#171a20;stroke:#71798a;stroke-width:2}.local{stroke:#55d6a7}.agent{stroke:#8c7bff}.cloud{stroke:#ff9a7b}.boundary{fill:none;stroke:#71798a;stroke-width:1.5;stroke-dasharray:8 8}.flow{fill:none;stroke:#ff9a7b;stroke-width:2.5;marker-end:url(#arrow)}.dash{stroke-dasharray:7 7}.h{font:700 24px system-ui,sans-serif;fill:#f5f6f8}.p{font:400 17px system-ui,sans-serif;fill:#c4c9d2}.tiny{font:400 15px system-ui,sans-serif;fill:#b9bec8}.k{font:600 14px ui-monospace,monospace;fill:#55d6a7;letter-spacing:1px}
    </style>
  </defs>
  <rect width="1440" height="810" rx="24" fill="url(#bg)"/>
  <text class="h" x="34" y="42">One presence. Three purposes. Different authority.</text>
  <rect class="boundary" x="26" y="70" width="324" height="625" rx="18"/>
  <rect class="boundary" x="380" y="70" width="580" height="625" rx="18"/>
  <rect class="boundary" x="990" y="70" width="424" height="625" rx="18"/>
  <text class="k" x="48" y="100">LOCAL ROBOT / TRUSTED UI</text>
  <text class="k" x="402" y="100">TRUSTED BRIDGE + AGENT HOST</text>
  <text class="k" x="1012" y="100">EXTERNAL SERVICES</text>
  <!-- Arrows precede opaque boxes so routes never bleed through labels. -->
  <path class="flow" d="M188 266V296"/>
  <path class="flow dash" d="M324 413H368V215H400"/>
  <path class="flow dash" d="M368 413H400"/>
  <path class="flow dash" d="M368 413V573H400"/>
  <path class="flow dash" d="M936 210H1008"/>
  <path class="flow dash" d="M936 394H974V242H1008"/>
  <path class="flow dash" d="M936 580H984V274H1008"/>
  <path class="flow dash" d="M936 430H1008"/>
  <path class="flow dash" d="M324 453H358V681H974V589H1008"/>
  <rect class="box local" x="48" y="130" width="276" height="136" rx="14"/>
  <text class="h" x="68" y="164">Reachy Mini</text>
  <text class="p" x="68" y="197">Mic · speaker · camera</text>
  <text class="p" x="68" y="225">Motors · guarded safe fold</text>
  <rect class="box local" x="48" y="296" width="276" height="280" rx="14"/>
  <text class="h" x="68" y="333">Homebody app</text>
  <text class="p" x="68" y="371">Local wake and privacy</text>
  <text class="p" x="68" y="401">Consent and Stop controls</text>
  <text class="p" x="68" y="431">Purpose + speech selection</text>
  <text class="p" x="68" y="461">Opt-in private camera preview</text>
  <text class="tiny" x="68" y="502">Wireless or Lite + host</text>
  <text class="tiny" x="68" y="530">Pi · Jetson · PC · Mac</text>
  <text class="tiny" x="48" y="626">Preview: WebRTC or private HTTPS.</text>
  <text class="tiny" x="48" y="651">No cloud model for live preview.</text>
  <rect class="box local" x="400" y="130" width="536" height="174" rx="14"/>
  <text class="h" x="422" y="167">Everyday / narrow inference</text>
  <text class="p" x="422" y="202">Questions · host clock · configured weather</text>
  <text class="p" x="422" y="233">Only explicitly allowlisted household actions</text>
  <text class="tiny" x="422" y="272">No private memory, project tools or full-agent fallback</text>
  <rect class="box local" x="400" y="326" width="536" height="174" rx="14"/>
  <text class="h" x="422" y="363">Kids / isolated moderated inference</text>
  <text class="p" x="422" y="398">Age-aware activities · bounded I Spy validation</text>
  <text class="p" x="422" y="429">Camera consent · input/output moderation</text>
  <text class="tiny" x="422" y="468">No adult memory, agent tools or household controls</text>
  <rect class="box agent" x="400" y="522" width="536" height="140" rx="14"/>
  <text class="h" x="422" y="559">Workspace / native Hermes session</text>
  <text class="p" x="422" y="591">Registered project · real history · agent tools</text>
  <text class="tiny" x="422" y="631">Exact work approval + fixed verification and receipts</text>
  <rect class="box cloud" x="1008" y="130" width="384" height="214" rx="14"/>
  <text class="h" x="1030" y="167">Text + vision</text>
  <text class="p" x="1030" y="204">Optional ChatGPT subscription</text>
  <text class="p" x="1030" y="235">Saved host Codex authentication</text>
  <text class="p" x="1030" y="266">Genuine none; no paid text fallback</text>
  <text class="tiny" x="1030" y="306">Subscription funding is not local inference.</text>
  <rect class="box cloud" x="1008" y="366" width="384" height="130" rx="14"/>
  <text class="h" x="1030" y="403">Safety screening</text>
  <text class="p" x="1030" y="437">Moderation API remains enabled</text>
  <text class="tiny" x="1030" y="471">Not replaced by subscription chat</text>
  <rect class="box cloud" x="1008" y="518" width="384" height="144" rx="14"/>
  <text class="h" x="1030" y="555">Speech providers</text>
  <text class="p" x="1030" y="589">Pipeline · Realtime · GPT-Live preview</text>
  <text class="tiny" x="1030" y="626">Separate audio services and API charges</text>
  <text class="tiny" x="34" y="734">Solid = local. Dashed = authenticated host or external route. Provider credentials stay on the trusted host.</text>
  <text class="tiny" x="34" y="761">Cloud data requires the configured path and consent; optional local vision is a separate setup. Workspace CWD is context, not a sandbox.</text>
  <text class="tiny" x="34" y="788">OpenClaw conversation compatibility does not imply native Workspace or subscription parity. Local controls work without an agent.</text>
</svg>
